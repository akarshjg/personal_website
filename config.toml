baseURL = "https://www.akarsh.xyz/"
languageCode = "en-us"
theme = "raditian-free-hugo-theme"

[taxonomies]
  category = "categories"
  tag = "tags"
  book_author = "book_authors"

# Plugins
[params.plugins]

  # CSS Plugins
  [[params.plugins.css]]
  URL = "css/main.css"
  [[params.plugins.css]]
  URL = "css/rad-icons.css"
  [[params.plugins.css]]
  URL = "css/custom.css"

  # JS Plugins
  [[params.plugins.js]]
  URL = "js/rad-animations.js"
  [[params.plugins.js]]
  URL = "js/sticky-header.js"
  [[params.plugins.js]]
  URL = "js/library/fontfaceobserver.js"


# navigation
[menu]

  [[menu.header]]
  name = "About"
  URL = "/#about"
  weight = 2


   # Add Blog to the Header Menu
  [[menu.header]]
  name = "Blog"
  URL = "/blog/"
  weight = 3

    # Add Books to the Header Menu
  [[menu.header]]
  name = "Books"
  URL = "/books/"
  weight = 4

  [[menu.header]]
  name = "Contact"
  URL = "/#contact"
  weight = 5


  [[menu.footer]]
  name = "About"
  URL = "/#about"
  weight = 2


  # Add Blog to the Footer Menu
  [[menu.footer]]
  name = "Blog"
  URL = "/blog/"
  weight = 3

    # Add Books to the Footer Menu
  [[menu.footer]]
  name = "Books"
  URL = "/books/"
  weight = 4

  [[menu.footer]]
  name = "Contact"
  URL = "/#contact"
  weight = 5


[params]

  sections = ["showcase", "about", "education", "experience", "client-and-work", "testimonial", "contact", "newsletter"]


  googleTagManagerID = "GTM-MFKDFNS" # Google Analytics works with Google Tag Manager

  [params.logo]
    text1 = "akarsh"
    text2 = "galagali"

  [params.footer]
      copyright = "© 2023 - 2026 | Akarsh Galagali. All rights reserved."

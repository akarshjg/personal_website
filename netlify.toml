[build]
  command = "python3 scripts/fetch_instagram_feed.py && python3 scripts/import_goodreads_csv.py goodreads_library_export.csv && hugo"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.90.1"
  NODE_VERSION = "18.20.0"

[context]
  [context.production]
    [context.production.environment]
      HUGO_VERSION = "0.90.1"
      NODE_VERSION = "18.20.0"

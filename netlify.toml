[build]
  command = "python3 scripts/import_goodreads_csv.py goodreads_library_export.csv && hugo"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.90.1"
  NODE_VERSION = "18.20.0"

[context]
  [context.production]
    [context.production.environment]
      HUGO_VERSION = "0.90.1"
      NODE_VERSION = "18.20.0"

# Performance & Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Immutable 1-year cache for images
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Immutable 1-year cache for fonts
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Long-term cache for CSS and JS
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, must-revalidate"

# HTML pages should always be revalidated for instant updates
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
